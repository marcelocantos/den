# Homebrew tap publication for den (Formula/den.rb in marcelocantos/homebrew-tap).
# It runs on the dev Mac, not in Actions, so there is no tap token in Actions
# secrets. Publish with `make release-tap` (scripts/release-tap.sh), NOT
# a bare `tapper push`: this file deliberately has no formula_includes,
# because the bottle block (root_url + per-tag sha256) changes every release.
# release-tap.sh downloads the GA assets, verifies the bottles, and renders
# a per-release config (this file + formula_includes) via
# `scripts/homebrew-bottles.py tapper-config`. A bare `tapper push` would
# publish a bottle-less formula, and macOS installs would build from source.
#
# install/test must stay identical to INSTALL/TEST in
# scripts/homebrew-bottles.py; tapper-config refuses to render otherwise.
repo: marcelocantos/den
tap:
  owner: marcelocantos
  name: homebrew-tap
  formula_folder: Formula
push:
  darwin_arm64: true
  linux_amd64: true
  linux_arm64: true
  skip_checksum: true
  update_readme_table: true
# Token lookup (tapper token.Resolve), first non-empty wins:
#   1. $HOMEBREW_TAP_TOKEN (token.env below)
#   2. $TAPPER_GITHUB_TOKEN
#   3. macOS keychain, service "tapper", account "marcelocantos/homebrew-tap"
#      (no keychain_account override; `tapper token status` shows which).
# Normally neither env var is set and the keychain entry is used.
# token.op is NOT read by `tapper push`: it is only where
# `tapper token import-op` (and `tapper token rotate`, as a fallback) fetch
# the PAT from 1Password to store it in that keychain entry.
token:
  env: HOMEBREW_TAP_TOKEN
  op: op://Personal/GitHub Homebrew Tap PAT/token
install: |
  bin.install "den"
  pkgshare.install "share/den/known_hashes.json" if File.exist?("share/den/known_hashes.json")
test: |
  assert_equal version.to_s, shell_output("#{bin}/den --version").strip
  ENV["DEN_HOME"] = (testpath/".den").to_s
  ENV["DEN_PREFIX"] = (testpath/"prefix").to_s
  assert_match "No packages installed", shell_output("#{bin}/den list")
