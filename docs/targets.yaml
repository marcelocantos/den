  T18:
    name: Native formula parser is sound for simple cases and refuses complex ones cleanly
    status: identified
    value: 5.0
    cost: 8.0
    acceptance:
    - 'The native parser (`src/formula/formula_parser.cpp`) classifies every formula as **SIMPLE**, **COMPLEX**, or **UNSUPPORTED**. SIMPLE: den can install the package using only the parser''s output, without invoking Ruby. COMPLEX: the formula uses at least one construct the parser does not handle (conditional blocks `if`/`unless`/`case`/`on_macos`/`on_linux`/`on_arm`, `resource { … }`, `patch do`, `bottle { … }`, `inreplace`, unresolvable string interpolation, unknown method calls on Formula instances, etc.). UNSUPPORTED: the parser could not read the source at all (syntax errors, encoding problems).'
    - '**Soundness invariant — no silent skipping.** The parser must never ignore a construct it does not understand. Every unhandled token/block either triggers COMPLEX classification or is surfaced as an error. The current behaviour of silently dropping `if`/`unless`/`resource`/`patch do`/generic `do` blocks is a soundness bug and must be fixed as part of this target.'
    - '**Soundness oracle.** A test binary runs the native parser *and* the Ruby extraction pipeline on a corpus of real formulae (popularity-tiered, top-500). For every formula classified as SIMPLE, the extracted metadata must match Ruby''s output field-by-field on all fields den consumes: `url`, `mirrors`, `sha256`, `version`, `dependencies` (grouped by type: build / runtime / optional / recommended / test), `license`, `homepage`, `keg_only`, resolved install commands, and resolved env settings. A SIMPLE classification with a field mismatch is a test failure.'
    - '**Complexity explainability.** For every formula classified as COMPLEX, the parser emits a structured reason identifying which construct(s) triggered the refusal (e.g. `{formula: "openssl@3", complexity_markers: ["on_macos block at line 42", "resource \"cacert\" at line 58"]}`). Humans reviewing a COMPLEX verdict can see why.'
    - '**CI gate.** The oracle runs on every PR. The set of formulae currently classified SIMPLE is committed as a baseline (e.g. `tests/corpus/simple_formulae.txt`). Regressions — a formula previously SIMPLE becomes COMPLEX or UNSUPPORTED, or a SIMPLE classification starts failing the soundness oracle — fail the PR. Expanding the SIMPLE set (handling new constructs correctly) is always allowed and requires a baseline update in the same PR.'
    - '**Installable-for-real check.** A subset of the SIMPLE-classified corpus is actually installed end-to-end in CI via den, using only the parser''s output and no Ruby process. A failed install on any formula in this subset fails the PR. This guards completeness — the parser''s metadata isn''t just equivalent to Ruby''s, it''s *sufficient* to drive a real install.'
    context: |-
      **Premise (corrected 2026-04-11 after audit).** The native C++ parser in `src/formula/formula_parser.cpp` is a **fast path for simple formulae**, not a replacement for Ruby. Ruby remains permanent infrastructure for the complex path — anything involving conditional blocks, resources, patches, bottle specs, inreplace, or arbitrary DSL method calls. The native parser exists so den can install simple formulae without spinning up a Ruby interpreter.

      **The bug this target fixes.** Audit on 2026-04-11 found that the current parser silently drops unhandled constructs: `if`/`unless`/`case` blocks, `resource { ... }`, `patch do`, `inreplace`, and generic `do` blocks are all skipped without a word. That means a formula with an `on_linux` block gets silently treated as if the `on_linux` block didn't exist — partial metadata, wrong install commands, wrong behaviour on Linux. Under the fast-path framing this is *the* correctness bug: the parser must either handle a construct or refuse. Silent skipping is never acceptable.

      **Two properties to establish** (from user direction):
      1. **Soundness of classification** — the parser correctly identifies simple cases and never mis-classifies a complex case as simple.
      2. **Completeness of extraction for simple cases** — for formulae classified as simple, the extracted metadata is complete and den can use it directly without calling Ruby.

      **Implementation sketch:**
      - Add a `FormulaComplexity` enum (`Simple` / `Complex` / `Unsupported`) and return it alongside `ParsedFormula`. `src/build/source_build.cpp` uses the verdict to decide between the fast path and the Ruby fallback — per-formula, not per-field.
      - Every `if`/`unless`/`case`/`on_*`/`resource`/`patch`/`inreplace`/`bottle`/`do`-block that the parser encounters becomes a complexity marker, not a silently-skipped line. The parser keeps reading to collect all markers (for explainability) but returns Complex.
      - Add a test harness at `tests/oracle/` that runs the native parser and the Ruby pipeline on a corpus and compares field-by-field for SIMPLE classifications.
      - Curate the corpus: start with the top-500 formulae, classify by hand where necessary, commit the expected verdicts.
      - Wire into CI as a new workflow job.

      **Relationship to other targets.** This target is not a stepping stone toward retiring Ruby — 🎯T54 (retire bundled Ruby) was retired on the same day this was reframed, because its premise was wrong. Ruby is permanent. 🎯T18 is about making the fast path *trustworthy*, not about eliminating the slow path.

      **Out of scope:** extending the fast path to handle any new DSL constructs (that's follow-up work, filed as separate targets). Making the parser a general-purpose Ruby evaluator (never). Matching Ruby's extraction on any field den does not consume (keep the comparison surface small).
    origin: manual
    discovered: 2026-04-09
