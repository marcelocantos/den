name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja libarchive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libarchive-dev

      # `make test` is configure + build + test — the same recipe the
      # pre-push hook runs via `make gate`. The format half of the gate runs
      # in the `format` job below, where clang-format is installed.
      - name: Gate (configure, build, test)
        run: make test

      - name: Verify CLI
        run: |
          ./build/den --version
          ./build/den --help

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      # The repo's own format oracle, so CI and the pre-push gate check the
      # same file set with the same command. A format difference fails the
      # job; it used to be an ignorable ::warning::.
      - name: Check formatting
        run: make format
