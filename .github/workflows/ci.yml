name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Supersede in-flight runs for the same PR only. Pushes to master get a
# per-run group (github.run_id), so a master run is never cancelled or
# held pending behind another — every master commit is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15, not macos-14: GitHub retires the macOS 14 image on
        # 2026-11-02 and has cut its capacity in the run-up, so macos-14
        # jobs were failing with "not acquired by Runner of type hosted".
        # The binary's floor is CMAKE_OSX_DEPLOYMENT_TARGET (14.0), not
        # the runner OS.
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pinned toolchain (macOS)
        # Official cmake/ninja release builds, SHA-256-pinned in
        # .github/actions/toolchain/versions.env; no Homebrew (#158).
        if: runner.os == 'macOS'
        uses: ./.github/actions/toolchain

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev zlib1g-dev libbz2-dev patchelf

      - name: Configure
        # libarchive (+xz/zstd/lz4) is vendored and linked statically
        # (DEN_VENDOR_LIBARCHIVE=ON, the default): no Homebrew/apt libarchive.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Check binary links only base-OS libraries
        run: scripts/check-links.sh build/den

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Verify CLI
        run: |
          ./build/den --version
          ./build/den --help

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang-format
        # Exact version pinned in .clang-format-version, shared with the
        # Makefile's format targets. PyPI wheel, isolated in a venv.
        run: |
          version=$(cat .clang-format-version)
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet "clang-format==$version"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: Verify clang-format version
        run: |
          version=$(cat .clang-format-version)
          clang-format --version
          clang-format --version | grep -q "clang-format version $version\b" \
            || { echo "::error::clang-format is not the pinned $version"; exit 1; }

      - name: Format source files
        run: make format-fix CLANG_FORMAT=clang-format

      - name: Check formatting
        # Blocking: with no PRs, a red Format on master is the drift signal.
        run: |
          if ! git diff --quiet; then
            echo "::error::Code formatting differs from clang-format $(cat .clang-format-version). Run: make format-fix"
            git diff --stat
            exit 1
          fi
