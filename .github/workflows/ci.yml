name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Supersede in-flight runs for the same PR only. Pushes to master get a
# per-run group (github.run_id), so a master run is never cancelled or
# held pending behind another — every master commit is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15, not macos-14: GitHub retires the macOS 14 image on
        # 2026-11-02 and has cut its capacity in the run-up, so macos-14
        # jobs were failing with "not acquired by Runner of type hosted".
        # The binary's floor is CMAKE_OSX_DEPLOYMENT_TARGET (14.0), not
        # the runner OS.
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev zlib1g-dev libbz2-dev patchelf

      - name: Configure
        # libarchive (+xz/zstd/lz4) is vendored and linked statically
        # (DEN_VENDOR_LIBARCHIVE=ON, the default): no Homebrew/apt libarchive.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Check binary links only base-OS libraries
        run: scripts/check-links.sh build/den

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Verify CLI
        run: |
          ./build/den --version
          ./build/den --help

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Format source files
        run: find src tests -name '*.h' -o -name '*.cpp' | xargs clang-format-18 -i --style=file

      - name: Check formatting
        run: |
          if ! git diff --quiet; then
            echo "::warning::Code formatting differs from clang-format-18. Run: find src tests -name '*.h' -o -name '*.cpp' | xargs clang-format -i"
            git diff --stat
          fi
