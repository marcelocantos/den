name: Harness Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR only. Pushes to master get a
# per-run group (github.run_id), so a master harness run is never
# cancelled by a later push — every master commit is checked.
concurrency:
  group: harness-linux-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-linux:
    name: Harness Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev zlib1g-dev libbz2-dev patchelf

      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify den binary
        run: ./build/den --version

      - name: Run Linux harness
        timeout-minutes: 30
        run: tests/harness/linux/run.sh --binary build/den

      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: harness-linux-logs-${{ github.run_id }}
          path: tests/harness/linux/logs/
