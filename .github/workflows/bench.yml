name: Benchmark (den vs brew)

# Retries dispatched by bench-capacity-retry.yml carry the capacity_retry_*
# inputs, so their runs are titled
# "Benchmark capacity-retry of <sha> (run <id>)". The companion keys its
# per-scheduled-run cap (at most 2 retries, the second 30 min after a
# capacity-lost first) on "(run <id>)". Every other run keeps the plain
# workflow name.
run-name: >-
  ${{ inputs.capacity_retry_sha
      && format('Benchmark capacity-retry of {0} (run {1})',
                inputs.capacity_retry_sha, inputs.capacity_retry_run)
      || github.workflow }}

on:
  schedule:
    # Weekly: every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: "hyperfine repetitions per read-only op"
        required: false
        default: "10"
      install_runs:
        description: "hyperfine repetitions per install/upgrade op"
        required: false
        default: "5"
      capacity_retry_sha:
        description: "Set by the capacity-retry workflow: scheduled head SHA being retried"
        required: false
        default: ""
      capacity_retry_run:
        description: "Set by the capacity-retry workflow: run id of the capacity-cancelled scheduled run"
        required: false
        default: ""

# Allow the job to push committed benchmark snapshots back to the repo so
# trends accumulate across releases (acceptance: results recorded over time).
permissions:
  contents: write

jobs:
  bench:
    name: Benchmark
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pinned toolchain (cmake, ninja, hyperfine)
        # Official release builds, SHA-256-pinned in
        # .github/actions/toolchain/versions.env; no Homebrew (#158).
        uses: ./.github/actions/toolchain
        with:
          tools: cmake ninja hyperfine

      - name: Check jq (runner image)
        run: jq --version

      - name: Configure
        run: |
          # libarchive is vendored and linked statically (#158).
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build den
        run: cmake --build build

      - name: Verify den binary
        run: ./build/den --version

      - name: Fetch den index
        run: |
          ./build/den update || echo "WARNING: den update failed; info/search ops will be skipped"

      - name: Run benchmark
        run: |
          RUNS="${{ github.event.inputs.runs || '10' }}"
          INSTALL_RUNS="${{ github.event.inputs.install_runs || '5' }}"
          # --with-install measures install + upgrade too; it mutates the
          # CI runner's Cellar but cleans up the test package on exit.
          scripts/bench/compare-brew.sh \
            --output-dir bench/results \
            --runs "${RUNS}" \
            --install-runs "${INSTALL_RUNS}" \
            --with-install

      - name: Check T68 contract
        run: |
          # Fail the job if den is no longer at least as fast as brew, or if a
          # measured op regressed against the previous same-host snapshot.
          # Cross-host baselines (e.g. a local M4 Max commit) are skipped —
          # absolute ms are not comparable across machines.
          scripts/bench/compare-results.sh

      - name: Commit benchmark snapshot
        # Persist results into the repo so a trend accrues across releases.
        # Only the scheduled/dispatch runs on the default branch push back.
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bench/results/
          if git diff --cached --quiet; then
            echo "No new benchmark snapshot to commit."
          else
            git commit -m "bench: den-vs-brew snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            # master often moves during the ~45 min run: rebase and retry.
            scripts/push-with-rebase-retry.sh master
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.run_id }}
          path: bench/results/
          retention-days: 90

      - name: Post summary
        if: always()
        run: |
          JSONFILE="$(ls bench/results/bench-*.json 2>/dev/null | sort | tail -1)"
          if [[ -z "${JSONFILE}" ]]; then
            echo "No benchmark output file found." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "## Benchmark results — den vs brew"
            echo ""
            echo "| op | tool | mean (ms) | stddev (ms) |"
            echo "|----|------|-----------|-------------|"
            jq -r '.[] | select(.mean_s != null) | "| \(.op) | \(.tool) | \((.mean_s*1000)|floor) | \((.stddev_s*1000)|floor) |"' \
              "${JSONFILE}" 2>/dev/null || echo "| — | — | (parse error) | — |"
            echo ""
            echo "Full results: artifact \`bench-results-${{ github.run_id }}\` and committed to \`bench/results/\`."
          } >> "${GITHUB_STEP_SUMMARY}"
