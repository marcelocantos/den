# No Homebrew tap — den replaces Homebrew, so distributing via tap is circular.
# Binaries are distributed via install.sh and GitHub Release assets.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            os: macos-14
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja libarchive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libarchive-dev

      - name: Configure
        run: |
          cmake_args="-B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake_args="$cmake_args -DCMAKE_PREFIX_PATH=$(brew --prefix libarchive)"
          fi
          cmake $cmake_args

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Package binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="den-${version}-${{ matrix.target }}.tar.gz"
          tar czf "${archive}" -C build den
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="den-${version}-${{ matrix.target }}.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "${archive}" "${archive}.sha256" --clobber

  checksums:
    name: Consolidated checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and consolidate checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksums="den-${version}-checksums.txt"
          for asset in $(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep '\.sha256$'); do
            gh release download "$GITHUB_REF_NAME" -p "$asset" -D /tmp/checksums
          done
          cat /tmp/checksums/*.sha256 > "${checksums}"
          gh release upload "$GITHUB_REF_NAME" "${checksums}" --clobber
