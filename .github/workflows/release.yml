name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive_os: darwin
            archive_arch: aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_os: linux
            archive_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_os: linux
            archive_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bin="den"
          src="target/${{ matrix.target }}/release/${bin}"

          archive="den-${version}-${{ matrix.archive_os }}-${{ matrix.archive_arch }}.tar.gz"
          tar czf "${archive}" -C "target/${{ matrix.target }}/release" "${bin}"
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="den-${version}-${{ matrix.archive_os }}-${{ matrix.archive_arch }}.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "${archive}" "${archive}.sha256" --clobber

  checksums:
    name: Consolidated checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and consolidate checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksums="den-${version}-checksums.txt"

          # Download individual .sha256 files from the release.
          for asset in $(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep '\.sha256$'); do
            gh release download "$GITHUB_REF_NAME" -p "$asset" -D /tmp/checksums
          done

          # Consolidate into one file.
          cat /tmp/checksums/*.sha256 > "${checksums}"
          gh release upload "$GITHUB_REF_NAME" "${checksums}" --clobber
