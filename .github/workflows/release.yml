# Binaries are distributed via install.sh and GitHub Release assets. GA
# releases are normally cut by promote-rc.yml (the marcelocantos/homebrew-tap
# formula is then published with `make release-tap` on the dev Mac); releases
# promote-rc creates use github.token and so do not trigger this workflow.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            os: macos-15
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev zlib1g-dev libbz2-dev

      - name: Configure
        # libarchive (+xz/zstd/lz4) is vendored and linked statically
        # (DEN_VENDOR_LIBARCHIVE=ON, the default): no Homebrew/apt libarchive.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Check binary links only base-OS libraries
        run: scripts/check-links.sh build/den

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Check binary version
        run: scripts/check-version.sh --binary build/den "${GITHUB_REF_NAME}"

      - name: Package binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="den-${version}-${{ matrix.target }}.tar.gz"
          scripts/package-release.sh build "${archive}"
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="den-${version}-${{ matrix.target }}.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "${archive}" "${archive}.sha256" --clobber

  checksums:
    name: Consolidated checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download and consolidate checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksums="den-${version}-checksums.txt"
          for asset in $(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep '\.sha256$'); do
            gh release download "$GITHUB_REF_NAME" -p "$asset" -D /tmp/checksums
          done
          cat /tmp/checksums/*.sha256 > "${checksums}"
          gh release upload "$GITHUB_REF_NAME" "${checksums}" --clobber
