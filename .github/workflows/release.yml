name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            os: macos-14
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja libarchive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libarchive-dev

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'linux-aarch64'
        run: |
          sudo dpkg --add-architecture arm64
          # Add arm64 sources — Ubuntu 24.04+ uses deb822 format
          codename=$(lsb_release -cs)
          echo "deb [arch=arm64] http://ports.ubuntu.com/ ${codename} main restricted universe" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ ${codename}-updates main restricted universe" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          # Pin existing sources to amd64 only
          for f in /etc/apt/sources.list.d/*.list; do
            [ "$f" = "/etc/apt/sources.list.d/arm64-ports.list" ] && continue
            sudo sed -i 's/^deb \[/deb [arch=amd64,/' "$f" 2>/dev/null || true
            sudo sed -i 's/^deb http/deb [arch=amd64] http/' "$f" 2>/dev/null || true
          done
          sudo apt-get update || true
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libcurl4-openssl-dev:arm64 libarchive-dev:arm64

      - name: Configure
        run: |
          cmake_args="-B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake_args="$cmake_args -DCMAKE_PREFIX_PATH=$(brew --prefix libarchive)"
          fi
          if [ "${{ matrix.target }}" = "linux-aarch64" ]; then
            cmake_args="$cmake_args -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64"
          fi
          cmake $cmake_args

      - name: Build
        run: cmake --build build

      - name: Test
        if: matrix.target != 'linux-aarch64'
        run: cd build && ctest --output-on-failure

      - name: Package binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="den-${version}-${{ matrix.target }}.tar.gz"
          tar czf "${archive}" -C build den
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="den-${version}-${{ matrix.target }}.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "${archive}" "${archive}.sha256" --clobber

  checksums:
    name: Consolidated checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and consolidate checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksums="den-${version}-checksums.txt"
          for asset in $(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep '\.sha256$'); do
            gh release download "$GITHUB_REF_NAME" -p "$asset" -D /tmp/checksums
          done
          cat /tmp/checksums/*.sha256 > "${checksums}"
          gh release upload "$GITHUB_REF_NAME" "${checksums}" --clobber

  homebrew:
    name: Update Homebrew formula
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: marcelocantos
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula_folder: Formula
          version: ${{ github.event.release.tag_name }}
          install: 'bin.install "den" => "den"'
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
          test: 'system bin/"den", "--version"'
          skip_checksum: true
          update_readme_table: true
