name: Benchmark capacity-retry

# Companion to bench.yml, modelled on source-build-smoke-capacity-retry.yml.
# When the *scheduled* weekly benchmark fails only because GitHub could not
# supply a macOS runner ("The job was not acquired by Runner of type hosted
# even after multiple attempts" / "Due to capacity constraints, jobs
# targeting macOS arm64 runners ..."), re-dispatch it. If that retry is
# lost to capacity as well, wait 30 min and dispatch one more: at most 2
# retries per scheduled run.
#
# Rules:
#   - Triggers only on completed *schedule* runs of the benchmark on master
#     whose conclusion is failure or cancelled. workflow_dispatch runs
#     never trigger it. The retries it dispatches use github.token, for
#     which GitHub creates no workflow_run event, so this job follows
#     retry 1 itself: it polls it to completion and, if the same classifier
#     finds only capacity cancels, sleeps and dispatches retry 2.
#   - Retries only if every non-successful job is a capacity cancel: a
#     macOS-labelled job, conclusion "cancelled", no steps ever ran, no
#     runner assigned, and a "not acquired by Runner" annotation. Any other
#     failed/cancelled/timed-out job is treated as a real failure and
#     nothing is retried.
#   - At most 2 capacity-retries per scheduled run, keyed on its id: each
#     retry is titled "Benchmark capacity-retry of <sha> (run <id>)", and the
#     runs with "(run <id>)" in their title (any status) are counted.
#     Retry 1 needs a count of 0; retry 2 needs exactly 1, rechecked after
#     the delay. A later scheduled miss on the same SHA (idle master) is a
#     new run id and can retry; a manual re-run of the same scheduled
#     attempt cannot.
#   - Per-run concurrency group (no cancel-in-progress) serialises duplicate
#     triggers (e.g. a manual re-run of the same scheduled attempt), so the
#     second one sees the first one's retry and stops.
#
# The logic lives in scripts/capacity-retry.sh (shared with the other
# *-capacity-retry.yml companion; tested by
# tests/scripts/test_capacity_retry.sh).
#
# A retry is an ordinary dispatch with the default runs/install_runs, so
# it measures and commits its snapshot exactly as the scheduled run would.

on:
  workflow_run:
    workflows: ["Benchmark (den vs brew)"]
    types: [completed]
    branches: [master]

permissions:
  actions: write # read run/jobs, dispatch bench.yml
  checks: read # read job annotations (check-run annotations API)

concurrency:
  group: bench-capacity-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  capacity-retry:
    name: Capacity retry (macOS)
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    # Covers following retry 1 (RETRY_WATCH_MINUTES) plus
    # RETRY_DELAY_SECONDS before retry 2.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/capacity-retry.sh
          sparse-checkout-cone-mode: false

      - name: Classify failed jobs and re-dispatch on capacity-only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MAX_RETRIES: "2"
          RETRY_DELAY_SECONDS: "1800"
          RETRY_WATCH_MINUTES: "75"
          DRY_RUN: "false"
        run: scripts/capacity-retry.sh bench.yml
