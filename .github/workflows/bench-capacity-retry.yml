name: Benchmark capacity-retry

# Companion to bench.yml, modelled on source-build-smoke-capacity-retry.yml.
# When the *scheduled* weekly benchmark fails only because GitHub could not
# supply a macOS runner ("The job was not acquired by Runner of type hosted
# even after multiple attempts" / "Due to capacity constraints, jobs
# targeting macOS arm64 runners ..."), re-dispatch it once.
#
# Rules:
#   - Triggers only on completed *schedule* runs of the benchmark on master
#     whose conclusion is failure or cancelled. workflow_dispatch runs
#     (including the retries this workflow creates) never trigger it.
#   - Retries only if every non-successful job is a capacity cancel: a
#     macOS-labelled job, conclusion "cancelled", no steps ever ran, no
#     runner assigned, and a "not acquired by Runner" annotation. Any other
#     failed/cancelled/timed-out job is treated as a real failure and
#     nothing is retried.
#   - At most one capacity-retry per scheduled run: the retry run is
#     titled "Benchmark capacity-retry of <sha> (run <id>)" and an existing
#     run with "(run <id>)" in its title (any status) blocks another.
#     A later scheduled miss on the same SHA (idle master) is a new run id
#     and can retry; a manual re-run of the same scheduled attempt cannot.
#   - Per-run concurrency group (no cancel-in-progress) serialises duplicate
#     triggers (e.g. a manual re-run of the same scheduled attempt), so the
#     second one sees the first one's retry and stops.
#
# The retry is an ordinary dispatch with the default runs/install_runs, so
# it measures and commits its snapshot exactly as the scheduled run would.

on:
  workflow_run:
    workflows: ["Benchmark (den vs brew)"]
    types: [completed]
    branches: [master]

permissions:
  actions: write # read run/jobs, dispatch bench.yml
  checks: read # read job annotations (check-run annotations API)

concurrency:
  group: bench-capacity-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  capacity-retry:
    name: Capacity retry (macOS)
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify failed jobs and re-dispatch on capacity-only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BENCH_WORKFLOW: bench.yml
          DRY_RUN: "false"
        run: |
          set -euo pipefail
          short_sha=${HEAD_SHA:0:12}
          summary=${GITHUB_STEP_SUMMARY:-/dev/stdout}

          jobs=$(gh api --paginate \
            "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '.')

          # Jobs that did not succeed (skipped/neutral jobs are fine: they
          # are dependents of a capacity-cancelled job or filtered out).
          bad=$(jq -c '[.[] | select(.conclusion != "success"
                                     and .conclusion != "skipped"
                                     and .conclusion != "neutral")]' <<<"$jobs")
          if [ "$(jq length <<<"$bad")" -eq 0 ]; then
            echo "::notice::No failed jobs in run $RUN_ID attempt $RUN_ATTEMPT; nothing to retry."
            exit 0
          fi

          capacity=0
          real=0
          while read -r job; do
            id=$(jq -r .id <<<"$job")
            name=$(jq -r .name <<<"$job")
            conclusion=$(jq -r .conclusion <<<"$job")
            macos=$(jq -r '[.labels[]? | ascii_downcase | startswith("macos")] | any' <<<"$job")
            nsteps=$(jq -r '.steps | length' <<<"$job")
            runner=$(jq -r '.runner_name // ""' <<<"$job")
            not_acquired=$(gh api "repos/$REPO/check-runs/$id/annotations" \
              --jq '[.[] | select(.message | test("not acquired by Runner"; "i"))] | length')
            if [ "$conclusion" = "cancelled" ] && [ "$macos" = "true" ] \
               && [ "$nsteps" -eq 0 ] && [ -z "$runner" ] && [ "$not_acquired" -gt 0 ]; then
              echo "capacity: $name (job $id)"
              capacity=$((capacity + 1))
            else
              echo "real:     $name (job $id): conclusion=$conclusion macos=$macos steps=$nsteps runner='$runner' not_acquired=$not_acquired"
              real=$((real + 1))
            fi
          done < <(jq -c '.[]' <<<"$bad")

          if [ "$real" -gt 0 ]; then
            echo "::notice::Run $RUN_ID has $real non-capacity failure(s); not retrying."
            echo "Not retried: $real non-capacity failure(s) in run $RUN_ID." >>"$summary"
            exit 0
          fi

          # One capacity-retry per scheduled run id, whatever its status.
          existing=$(gh api --paginate \
            "repos/$REPO/actions/workflows/$BENCH_WORKFLOW/runs?event=workflow_dispatch&per_page=100" \
            --jq ".workflow_runs[] | select(.display_title | contains(\"(run $RUN_ID)\")) | .html_url" \
            | head -1)
          if [ -n "$existing" ]; then
            echo "::notice::A capacity-retry for run $RUN_ID already exists: $existing"
            echo "Already retried run $RUN_ID: $existing" >>"$summary"
            exit 0
          fi

          master_sha=$(gh api "repos/$REPO/commits/$HEAD_BRANCH" --jq .sha)
          if [ "$master_sha" != "$HEAD_SHA" ]; then
            echo "::warning::$HEAD_BRANCH moved from $short_sha to ${master_sha:0:12}; the capacity-retry runs on the current $HEAD_BRANCH head."
          fi

          echo "Run $RUN_ID: $capacity macOS job(s) capacity-cancelled, no real failures; re-dispatching the benchmark."
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY_RUN: would dispatch $BENCH_WORKFLOW on $HEAD_BRANCH (capacity_retry_sha=$short_sha, capacity_retry_run=$RUN_ID)"
            exit 0
          fi
          gh workflow run "$BENCH_WORKFLOW" --repo "$REPO" --ref "$HEAD_BRANCH" \
            -f capacity_retry_sha="$short_sha" \
            -f capacity_retry_run="$RUN_ID"

          # Wait for the dispatched run to appear so the per-run guard above
          # sees it before this concurrency slot is released.
          url=""
          for _ in $(seq 1 18); do
            sleep 5
            url=$(gh api \
              "repos/$REPO/actions/workflows/$BENCH_WORKFLOW/runs?event=workflow_dispatch&per_page=20" \
              --jq ".workflow_runs[] | select(.display_title | contains(\"(run $RUN_ID)\")) | .html_url" \
              | head -1)
            [ -n "$url" ] && break
          done
          if [ -z "$url" ]; then
            echo "::warning::Dispatched, but the capacity-retry for run $RUN_ID did not appear within 90s."
          else
            echo "::notice::capacity-retry of $short_sha (run $RUN_ID): $url"
          fi
          echo "capacity-retry of $short_sha (run $RUN_ID): ${url:-dispatched, run not yet listed}" >>"$summary"
