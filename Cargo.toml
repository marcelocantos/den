[package]
name = "den"
version = "0.1.0"
edition = "2024"
description = "A universal development environment manager"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
dirs = "6"
tracing = "0.1"
thiserror = "2"
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
