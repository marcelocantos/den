[package]
name = "den"
version = "0.1.0"
edition = "2024"
description = "A universal development environment manager"
license = "Apache-2.0"
rust-version = "1.87"
repository = "https://github.com/marcelocantos/den"
homepage = "https://github.com/marcelocantos/den"
keywords = ["package-manager", "homebrew", "environment", "development"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Marcelo Cantos"]
readme = "README.md"

[lib]
name = "den"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
walkdir = "2"
tempfile = "3"
dirs = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
