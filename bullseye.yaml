  T18:
    name: Native formula parser is sound for simple cases and refuses complex ones cleanly
    status: achieved
    value: 5.0
    cost: 8.0
    acceptance:
    - '✅ **DONE (PR #20, 7e2c073)** — The native parser (`src/build/formula_parser.cpp`) classifies every formula as SIMPLE / COMPLEX / UNSUPPORTED via `FormulaComplexity`. Every unhandled DSL construct (`if`/`unless`/`case`/`on_macos`/`on_linux`/`on_arm`/`resource`/`patch`/`inreplace`/`bottle`/generic `do`) appends a `ComplexityMarker` and downgrades the verdict; the parser keeps reading so every offender is collected. `source_build.cpp` refuses to apply parser output on anything other than Simple.'
    - '✅ **DONE (PR #20)** — Complexity explainability: every COMPLEX verdict carries `{construct, line, detail}` markers identifying *why*. Unit tests in `tests/test_formula_parser.cpp` cover each unhandled construct, multi-marker collection, and whole-word keyword matching.'
    - '✅ **DONE (PR #24, 0cd85f0)** — Soundness oracle harness against a real-world corpus. `tests/corpus/homebrew-core` is a shallow submodule pin of `Homebrew/homebrew-core`. `tests/test_oracle.cpp` runs `parse_formula` on each entry in `tests/corpus/simple_formulae.txt` and `tests/corpus/complex_formulae.txt`, verifying classification and (for SIMPLE) that URL/SHA256 match the Ruby source verbatim. Found and fixed `jq`''s trailing-`if` silent drop on its first run.'
    - '✅ **DONE (PR #25, 07da754, via retired 🎯T57)** — Unresolvable `#{…}` interpolations are now refused. After substitution, any surviving `#{` in a system arg, mkdir_p target, or ENV value triggers an `interpolation` marker and downgrades to COMPLEX. Caught wget''s `#{Formula["openssl@3"].opt_prefix}` silent-drop.'
    - '✅ **DONE (PR #26, 71a5fbe)** — Field-by-field oracle comparison via golden JSON files. `scripts/update-oracle-golden.rb` is a dev-time tool that evaluates each SIMPLE-baseline formula with a minimal Ruby Formula stub and writes `tests/corpus/golden/<name>.json` with {url, sha256, build_commands, env_settings}. The oracle test loads the golden via `nlohmann::json` and diffs element-wise against `parse_formula` output using the sentinel prefix `/ORACLE_PREFIX/<name>`. Byte-identical comparison.'
    - '✅ **DONE (implicit, PR #24 onward)** — CI gate. The oracle suite runs in `ctest` on every PR via the existing CI matrix. Classification regressions (SIMPLE → COMPLEX, or SIMPLE → golden mismatch) fail the PR. Baseline files (`simple_formulae.txt`, `complex_formulae.txt`, `golden/*.json`) serve as the regression pin. Expanding the SIMPLE set is always allowed via the documented workflow (add to baseline → rerun golden generator → commit).'
    - ❌ **REMAINING — dependency extraction + comparison.** The native parser currently extracts URL, SHA256, build commands, and env settings — but not formula dependencies. The original 🎯T18 acceptance called for dependencies grouped by phase (build / runtime / optional / recommended / test) to be compared against Ruby's extraction. This is a parser extension, not just a harness change. Likely best as a separate target.
    - '❌ **REMAINING — installable-for-real check.** A subset of SIMPLE-classified corpus entries actually built end-to-end via den in CI, using only the parser''s output and no Ruby process. A failed install fails the PR. Guards completeness: metadata isn''t just equivalent to Ruby''s, it''s *sufficient* to drive a real install. Runs on cron rather than every PR due to cost. Likely PR 3 of the 🎯T18 sequence, or a separate target.'
    context: |-
      **Premise (corrected 2026-04-11 after audit).** The native C++ parser at `src/build/formula_parser.cpp` is a **fast path for simple formulae**, not a replacement for Ruby. Ruby remains permanent infrastructure for the complex path. The native parser exists so den can install simple formulae without spinning up a Ruby interpreter.

      **Status (2026-04-12 after PR #26).** Six of the original eight acceptance criteria are now achieved. The remaining two (dependency comparison and installable-for-real) both involve extending either the parser or CI rather than refining what's already there. The core "soundness for simple cases" property is established: classification is correct, silent drops are caught, and the oracle gives byte-identical comparison against Ruby for every SIMPLE-baseline entry.

      **Session run (PRs #24 → #25 → #26) took this target from "still identified" to "~75% done" in one sitting.** Oracle-first development found real silent-drop bugs on the first run of each PR: `jq`'s trailing-`if` (PR #24), `wget`'s `#{Formula[...].opt_prefix}` interpolation (PR #25), class-state leakage in the golden generator (caught during PR #26 dev, not a parser bug).

      **Open design decisions for the remaining work.** Dependency extraction is the bigger of the two — the native parser needs new state (what `depends_on "foo"` at the class level means) and the Ruby golden stub needs to surface it. Installable-for-real is a CI-level concern rather than a parser change.

      **Possible next moves.** Either retire 🎯T18 as "soundness achieved" and file two new targets for the remaining pieces (cleaner architecturally, easier to score), or keep 🎯T18 open and chip away at the two REMAINING items. The current framing (big umbrella target with internal sub-slices) has worked well for this session but may get stale.

      **Relationship to other targets.** 🎯T18 is not a stepping stone toward retiring Ruby — 🎯T54 was retired on 2026-04-11 because its premise was wrong. Ruby is permanent. 🎯T18 is about making the fast path *trustworthy*, not about eliminating the slow path.

      **Out of scope:** extending the fast path to handle any new DSL constructs (follow-up, filed as separate targets when needed). Making the parser a general-purpose Ruby evaluator (never). Matching Ruby's extraction on fields den does not consume.
