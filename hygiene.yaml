# hygiene.yaml — declared, drift-validated hygiene posture for den.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`.
# Sibling to bullseye.yaml: bullseye tracks aspirational state ("achieve X");
# hygiene tracks steady-state ("we maintain X").
#
# Tiers are PER DIMENSION (schema v1). For each dimension the held tier is the
# highest T such that every item in that dimension with tier <= T is satisfied.
# `floors` is the per-dimension ratchet: a dimension dropping below its floor
# is DRIFT and fails the check. `aspires` is the gap horizon for reporting.
# `enforce` is intent-only metadata and does NOT affect tiers.

schema_version: 1

repo: den
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 2
  security: 2
  quality: 2
  deps: 2
  release: 2
  governance: 2
  build: 2
  docs: 2
  perf: 2
  vcs: 0           # no committed git hooks yet
  agent: 2

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # platform matrix, format, release + governance, benches
  3: hardened    # sanitizers, secret/dep/SAST scanning, signing, fuzzing

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.tests
    dim: correctness
    desc: ctest (den_tests) runs on every push/PR
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_step: {workflow: ci.yml, name: Test}}

  - id: correctness.platform-matrix
    dim: correctness
    desc: Unit tests run on macOS 14 (arm64) and Ubuntu (x86_64) in CI
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {ci_job: ci.yml#check}

  - id: correctness.linux-harness
    dim: correctness
    desc: Owner-visible Linux smoke harness runs in CI on push/PR
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {ci_job: harness-linux.yml#harness-linux}

  - id: correctness.macos-harness
    dim: correctness
    desc: macOS smoke harness exists (manual; required attestation before GA promote)
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {make_target: harness-macos}

  - id: correctness.release-linux-arm64
    dim: correctness
    desc: Release builds (and tests) linux-aarch64 in addition to darwin-aarch64 and linux-x86_64
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release.yml#build}

  - id: correctness.sanitizers
    dim: correctness
    desc: ASan+UBSan (and TSan) run against the test suite in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: No sanitizer CMake option or CI job yet; correctness rests on ctest + harnesses.
    evidence: {absent: {ci_job: ci.yml#sanitize}}

  - id: correctness.fuzzing
    dim: correctness
    desc: Fuzz harnesses over formula/parser and archive extraction
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No fuzz targets or CI fuzz job yet.
    evidence: {absent: {file: {path: fuzz}}}

  - id: correctness.windows
    dim: correctness
    desc: Windows CI / installer support
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: den targets macOS and Linux only (install.sh rejects other uname); Windows is out of scope.
    evidence: {absent: {ci_job: ci.yml#windows}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.replica-verify
    dim: security
    desc: Independent GHCR bottle-hash replica is diff-verified daily and on replica-path pushes
    state: enforced
    cadence: periodic:1d
    enforce: blocking
    tier: 2
    evidence: {ci_job: replica-verify.yml#verify}

  - id: security.dep-pinning
    dim: security
    desc: Third-party C++ deps are vendored/pinned (headers + spdlog submodule) with NOTICES
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: NOTICES, matches: 'spdlog'}}

  - id: security.release-checksums
    dim: security
    desc: Release tarballs ship per-target SHA256 plus a consolidated checksums file
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release.yml#checksums}

  - id: security.fable-regressions
    dim: security
    desc: Fable audit findings F1–F5 stay closed via dedicated regression tests
    state: present
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {file: {path: tests/test_security_fable.cpp}}

  - id: security.secret-scan
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: No gitleaks config or CI invocation; relying on manual review.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.dep-vuln-scan
    dim: security
    desc: Vulnerability scanning of vendored C++ deps (osv-scanner over pinned versions)
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: Deps are vendored/pinned in vendor/ and NOTICES; no automated CVE watch on those pins.
    evidence: {absent: {scanner: {tool: osv-scanner}}}

  - id: security.sast
    dim: security
    desc: Static application security testing (CodeQL C/C++)
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: No CodeQL workflow; clang-format + ctest + fable tests are the current net.
    evidence: {absent: {ci_job: ci.yml#codeql}}

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions on ci.yml are read-only (least privilege)
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: ci.yml has no top-level permissions block; inherits the repo default.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: '(?m)^permissions:'}}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts carry provenance / are signed (cosign/sigstore)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: release.yml uploads tarballs + sha256; no signing/attestation step.
    evidence: {absent: {ci_step: {workflow: release.yml, name: Sign}}}

  # ============================== CODE QUALITY ============================
  - id: quality.clang-format
    dim: quality
    desc: A committed .clang-format defines the style
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .clang-format}}

  - id: quality.format
    dim: quality
    desc: Sources are clang-format clean (make format is the blocking /cv gate)
    state: present
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {make_target: format}

  - id: quality.format-ci-blocking
    dim: quality
    desc: CI format job fails the build on clang-format drift (not warn-only)
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      ci.yml `format` job reformats then emits ::warning:: on git diff; it does
      not fail. make format (--dry-run -Werror) is the actual gate. ENT-006.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: 'clang-format.*-Werror|--dry-run'}}}

  - id: quality.clang-tidy
    dim: quality
    desc: clang-tidy runs in CI over src/ and tests/
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No .clang-tidy config or CI tidy job.
    evidence: {absent: {file: {path: .clang-tidy}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.vendor-pins
    dim: deps
    desc: Vendored library versions are recorded in NOTICES
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: NOTICES, matches: 'CLI11 2[.]4[.]2'}}

  - id: deps.spdlog-submodule
    dim: deps
    desc: spdlog is pinned as a git submodule (not copied tree)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: .gitmodules, matches: 'gabime/spdlog'}}

  - id: deps.freshness
    dim: deps
    desc: Vendored upstreams reviewed against latest at each release
    state: manual
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {manual: {last_verified: 2026-08-22}}

  - id: deps.dependabot
    dim: deps
    desc: Dependabot (or equivalent) watches GitHub Actions and submodules
    state: planned
    cadence: periodic:30d
    enforce: informational
    tier: 3
    reason: No .github/dependabot.yml; Actions and submodules are bumped by hand.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.semver-minor
    dim: release
    desc: CMake project VERSION matches the latest GA git tag (MINOR-only releases)
    state: enforced
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: >-
        test "$(sed -n 's/^project(den VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
        = "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.0' | sed 's/^v//')"

  - id: release.ci-built
    dim: release
    desc: Release binaries are built by CI across darwin-aarch64, linux-x86_64, linux-aarch64
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release.yml#build}

  - id: release.install-sh
    dim: release
    desc: install.sh downloads the GitHub Release tarball (no Homebrew tap)
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: install.sh, matches: 'github.com/.*/releases'}}

  - id: release.rc-pipeline
    dim: release
    desc: Release-candidate workflow builds, Linux-harness-gates, and publishes a prerelease
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release-candidate.yml#publish}

  - id: release.homebrew-tap
    dim: release
    desc: Published to a Homebrew tap on release
    state: skipped
    cadence: per-release
    enforce: informational
    tier: 3
    reason: den replaces Homebrew; distributing den via a tap is circular. Binaries ship via GitHub Releases and install.sh.
    evidence: {absent: {ci_job: release.yml#homebrew}}

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git + GitHub release notes; no curated CHANGELOG.md yet.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README present and current
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers build/, target/, IDE/OS files, harness logs
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: SECURITY.md, matches: 'Reporting a Vulnerability'}}

  - id: governance.notices
    dim: governance
    desc: NOTICES records third-party attributions for vendored deps
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: NOTICES}}

  - id: governance.codeowners
    dim: governance
    desc: CODEOWNERS names review paths
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Sole-owner repo; no CODEOWNERS file.
    evidence: {absent: {file: {path: .github/CODEOWNERS}}}

  - id: governance.contributing-current
    dim: governance
    desc: CONTRIBUTING.md documents the C++/CMake workflow (not the retired Cargo path)
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: CONTRIBUTING.md still says cargo build / cargo test / clippy from the Rust era.
    evidence: {absent: {file: {path: CONTRIBUTING.md, matches: 'cmake --build'}}}

  # ================================= BUILD ===============================
  - id: build.cxx-standard
    dim: build
    desc: C++ standard pinned (CMAKE_CXX_STANDARD 23)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: CMakeLists.txt, matches: 'CMAKE_CXX_STANDARD 23'}}

  - id: build.parallel
    dim: build
    desc: Parallelism set via CMAKE_BUILD_PARALLEL_LEVEL in CMakeLists, not ad-hoc -j
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: CMakeLists.txt, matches: 'CMAKE_BUILD_PARALLEL_LEVEL'}}

  - id: build.bullseye-gate
    dim: build
    desc: make bullseye is the standing /cv gate (configure, build, test, format, clean-tree)
    state: present
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {make_target: bullseye}

  # ============================ DOCUMENTATION ============================
  - id: docs.todo
    dim: docs
    desc: docs/TODO.md exists as the repo TODO sink
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: docs/TODO.md}}

  - id: docs.bullseye
    dim: docs
    desc: bullseye.yaml is the intent ledger for followable work
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: bullseye.yaml}}

  - id: docs.trust-model
    dim: docs
    desc: Trust model (two-source bottle hash) is documented
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: docs/trust-model.md}}

  - id: docs.stability
    dim: docs
    desc: STABILITY.md catalogues the CLI/config compatibility surface
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: STABILITY.md}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve (no dead cross-references)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No markdown-link checker target or CI step.
    evidence: {absent: {make_target: check-md-links}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: den-vs-brew benchmark suite runs weekly in CI
    state: present
    cadence: periodic:7d
    enforce: informational
    tier: 2
    evidence: {ci_job: bench.yml#bench}

  - id: perf.regression-tracking
    dim: perf
    desc: Benchmark snapshots are compared against the previous committed result (T68 contract)
    state: present
    cadence: periodic:7d
    enforce: warning
    tier: 2
    evidence: {ci_step: {workflow: bench.yml, name: Check T68 contract}}

  - id: perf.pr-gate
    dim: perf
    desc: Benchmarks run (or a fast subset) on every PR to catch regressions before merge
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: bench.yml is weekly cron + workflow_dispatch, not push/PR.
    evidence: {absent: {file: {path: .github/workflows/bench.yml, matches: '(?m)^  pull_request:'}}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  - id: vcs.lfs-binaries
    dim: vcs
    desc: Large/binary assets tracked via Git LFS
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      vendor/den-ruby-bundle.tar.zst (~6.7 MB) is committed as a regular blob;
      no other large binaries. LFS would add a smudge/pointer footgun without
      a hooksPath-safe LFS pre-push.
    evidence: {absent: {file: {path: .gitattributes}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.claude-md
    dim: agent
    desc: CLAUDE.md present and current (conventions discoverable by agents)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: CLAUDE.md}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.cli-help
    dim: agent
    desc: Binary exposes --version and --help, verified in CI
    state: present
    cadence: continuous
    enforce: informational
    tier: 2
    evidence: {ci_step: {workflow: ci.yml, name: Verify CLI}}
